[project]
name = "antlia"
version = "0.1.0"
description = "Single source of truth for market and account data -- multi-source cache, live pulls, and authentication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# tzdata: ib_insync parses execution timestamps into US/Eastern, a "backward"
# zone that a slim Linux image does not ship. Without it, reading fills
# raises ZoneInfoNotFoundError from inside the decoder.
ibkr = ["ib_insync>=0.9.86", "tzdata>=2024.1"]
# python-dotenv is an undeclared dependency of the thetadata SDK: its
# client.py imports it at module level without listing it. Without this the
# extra installs and then fails at import.
thetadata = ["thetadata>=1.0", "python-dotenv>=1.0"]
trading212 = ["httpx>=0.27"]
yfinance = ["yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antlia"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ib_insync.*", "thetadata.*", "yfinance.*", "httpx.*"]
ignore_missing_imports = true

# Strict is for the code that ships. Annotating every test function proves
# nothing here and makes the tests worse to read.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "antlia"
version = "0.1.0"
description = "Single source of truth for market data -- multi-source cache, live pulls, and authentication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# tzdata: ib_insync parses execution timestamps into US/Eastern, a "backward"
# zone that a slim Linux image does not ship. Without it, reading fills
# raises ZoneInfoNotFoundError from inside the decoder.
ibkr = ["ib_insync>=0.9.86", "tzdata>=2024.1"]
# python-dotenv is an undeclared dependency of the thetadata SDK: its
# client.py imports it at module level without listing it. Without this the
# extra installs and then fails at import.
thetadata = ["thetadata>=1.0", "python-dotenv>=1.0"]
# The `history` store: DuckDB reads the Parquet tier directly (no server, no
# load step) and pyarrow is what a read hands back. Both are the layer's own
# machinery, not a consumer's dataframe preference -- pandas and polars stay
# out, and `frame="pandas"` imports one only when a caller asks for it.
# pytz is duckdb's undeclared dependency, the same trap as python-dotenv
# above: converting a TIMESTAMPTZ to a Python object imports it, and
# `ingested_at` is one -- so `ingests()` and every `as_of=` read need it.
# It used to arrive transitively via pandas; pandas 3.0 dropped it, which is
# what made a latent gap into a failure.
store = ["duckdb>=1.0", "pyarrow>=16", "pytz>=2024.1"]
trading212 = ["httpx>=0.27"]
yfinance = ["yfinance>=0.2"]
# pandas and polars are here and nowhere else: they are a *consumer's*
# preference, never this library's, so `frame="pandas"` imports one only when
# a caller asks. The tests that prove that conversion works still need both
# installed, and without them `uv sync --extra dev --extra store` leaves a
# suite that fails for a reason that has nothing to do with antlia.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.2", "polars>=1.0"]

# The one command antlia ships. It is ingest/admin plumbing -- warming a cache
# is a batch job you run from a shell or a cron entry, not from inside a
# backtest -- and it exists here so every consumer does not rewrite the warming
# script that hawk already had. `python -m antlia.history.cli` is the
# equivalent when the entry point is not on PATH.
[project.scripts]
antlia-history = "antlia.history.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antlia"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ib_insync.*", "thetadata.*", "yfinance.*", "httpx.*", "duckdb.*", "pyarrow.*", "polars.*"]
ignore_missing_imports = true

# Strict is for the code that ships. Annotating every test function proves
# nothing here and makes the tests worse to read.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
